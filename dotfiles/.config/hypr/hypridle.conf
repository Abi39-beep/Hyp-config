general {
    lock_cmd = qs -c syslock ipc call syslock lock
    before_sleep_cmd = loginctl lock-session    
    after_sleep_cmd = hyprctl dispatch dpms on  
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            
}

listener {
    timeout = 360                                 # 6min
    on-timeout = systemctl suspend                # suspend pc
}
