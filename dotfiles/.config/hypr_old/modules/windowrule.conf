##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# Firefox
windowrule = opaque on, match:class ^(firefox)$

# Onlyoffice
windowrule = opaque on, match:class ^(ONLYOFFICE)$
windowrule = float on, center on, match:class ^(DesktopEditors)$, match:title ^(Open Document|Save As)$

# Thunar
windowrule = float on, center on, match:class ^(thunar)$, match:title ^(.*Rename.*)$

# Papers Document-viewer
windowrule = opaque on, match:class ^(org.gnome.Papers)$

# FreeCAD
windowrule = opaque on, match:class ^(org.freecad.FreeCAD)$

### Layerrule ###
layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0, match:namespace ^(rofi)$
layerrule = blur on, match:namespace ^(logout_dialog)$

xwayland {
    force_zero_scaling = true
}


