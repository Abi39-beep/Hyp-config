#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
source = ~/.config/hypr/color.conf

general {
    gaps_in = 1
    gaps_out = 1

    border_size = 1

    # https://wiki.hypr.land/Configuring/Variables/#variable-types for info about colors
    col.active_border = $bg4
    col.inactive_border = $grey2 

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = scrolling
}

scrolling {
    fullscreen_on_one_column = true
    column_width = 0.5
    focus_fit_method = 1
    explicit_column_widths = 0.333, 0.5, 0.667, 1.0
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 15
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.75
    inactive_opacity = 0.65
    fullscreen_opacity = 1.0

    shadow {
        enabled = false 
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    blur {

        enabled = true
        size = 10 
        passes = 4
        ignore_opacity = true
        new_optimizations = true
        xray = false
        noise = 0.0117
        contrast = 0.9
        brightness = 0.8
        vibrancy = 0.2
        vibrancy_darkness = 0.0
        
       #vibrancy = 0.1696

        popups = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

# Bezier curves
  bezier = smoothOut, 0.36, 0, 0.66, -0.56
  bezier = smoothIn, 0.25, 1, 0.5, 1
  bezier = overshot, 0.05, 0.9, 0.1, 1.05
  bezier = softSnap, 0.4, 0, 0.2, 1
  bezier = fluent, 0.0, 0.0, 0.2, 1.0
  bezier = easeInOutExpo, 0.87, 0, 0.13, 1

  # Windows
  animation = windows, 1, 5, overshot, popin 80%
  animation = windowsIn, 1, 5, overshot, popin 80%
  animation = windowsOut, 1, 4, smoothOut, popin 95%
  animation = windowsMove, 1, 4, softSnap

  # Layers
  animation = layersIn, 1, 7, smoothIn, slide right
  animation = layersOut, 1, 8, softSnap, slide right

  # Fade
  animation = fade, 1, 4, smoothIn
  animation = fadeIn, 1, 4, smoothIn
  animation = fadeOut, 1, 4, smoothOut
  animation = fadeSwitch, 1, 4, smoothIn
  animation = fadeShadow, 1, 4, smoothIn
  animation = fadeDim, 1, 4, smoothIn
  animation = fadeDpms, 1, 4, smoothIn
  animation = fadeLayers, 1, 3, softSnap

  # Workspaces
  animation = workspaces, 1, 5, overshot, slidefade 30%
  animation = specialWorkspace, 1, 5, overshot, slidefadevert 30%
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
